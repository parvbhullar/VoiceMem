[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicemem"
version = "0.2.3"
description = "Left-brain/right-brain memory framework with an audio-native perception layer (scene/speaker/emotion)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Lang Jiaqi" }]
keywords = ["memory", "voice", "agent", "llm", "speech", "rag"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# `pip install voicemem` installs every built-in component in one command: ASR, VAD,
# speaker ID, scene, emotion, local embedding, plus the runtime deps for the web demo
# and examples/.
#
# These used to live in the [slm] extra, so a user who installed the base package by
# following the README still hit ModuleNotFoundError: funasr -- the extra was named
# "slm" and nobody expects ASR to be hiding in there.
dependencies = [
    "numpy",
    "openai",
    "mem0ai",
    # -- audio pipeline --
    "torch",
    "torchaudio",         # funasr imports it internally but does not declare it
    "torchvision",        # transformers needs Qwen2VLVideoProcessor to load Qwen2.5-Omni,
                          # and that imports torchvision. Missing it raises nothing -- the
                          # emotion attributor **silently** falls back to the purely acoustic
                          # quadrant, so "I love strawberries" reads as sad and the whole
                          # right brain goes wrong.
    # Both bounds come from pipecat-ai[speechmatics], which we run alongside this package:
    #   pipecat-ai[speechmatics] -> speechmatics-voice[smart] -> transformers>=4.57.0,<5
    # Matching that range here means pip reports a conflict up front instead of silently
    # resolving to a transformers our voice stack cannot use.
    #
    # It is also correct on our own terms:
    #   - floor: the Qwen2_5Omni* classes (Qwen2_5OmniProcessor /
    #     Qwen2_5OmniThinkerForConditionalGeneration, see emotion/paper_emotion_detector.py)
    #     only exist from 4.52 on, so 4.57 clears that comfortably.
    #   - ceiling: transformers 5.x renamed from_pretrained's torch_dtype to dtype, and
    #     paper_emotion_detector.py and finetune/train.py still pass the old name.
    "transformers>=4.57,<5",
    "accelerate",         # required by the emotion attributor's
                          # from_pretrained(device_map="auto"); missing it is another
                          # silent degradation, not an error.
    "funasr",             # streaming ASR (default)
    "modelscope",         # how funasr fetches models
    "sherpa-onnx",        # VAD + speaker ID + fallback ASR (pure onnx)
    # Local E5 (memory vectors / slot classification). Floor 5.2.3 matches what
    # super.ai/super pins, so installing into that env does not move the package.
    # The <6 ceiling states a constraint pip would otherwise have to discover by
    # backtracking: sentence-transformers 6.x wants transformers>=5.0.0, which cannot
    # coexist with our transformers<5 above. Writing it down keeps resolution fast and
    # keeps the two bounds tied together if the transformers ceiling ever moves.
    "sentence-transformers>=5.2.3,<6",
    "soundfile",          # reads mp3/m4a/flac; without it we fall back to stdlib wave,
                          # which only accepts PCM wav
    "scipy",
    # -- web demo (web/run.py) and examples/ --
    "fastapi",
    "uvicorn",
    "pydantic",           # imported at the top of web/utils.py (fastapi pulls it in, but
                          # do not rely on that)
    "websockets>=14",     # uvicorn serving WebSocket; examples/05 also uses it for realtime
    "sounddevice",        # the voice agent in examples/: microphone + speaker
    "pywebrtc-audio",     # echo cancellation (lets you barge in over a loudspeaker)
]

[project.optional-dependencies]
rtc = [
    "av>=14",
]

# For running our fine-tuned Qwen reply model (Qwen3.6-35B-A3B + QLoRA adapter).
# The weights are not in the wheel; fetch them with
# `bash scripts/download_models.sh --reply-adapter`.
slm = [
    "peft",               # loads the QLoRA adapter
    "qwen-omni-utils",    # multimodal input preprocessing for Qwen-Omni
    "audioread",          # qwen-omni-utils imports it at the top but does not declare it;
                          # without it `import qwen_omni_utils` is a hard
                          # ModuleNotFoundError.
]

# Only these two commands. Everything else is a plain pip install -- no more extras,
# because an extra whose name does not match its contents is exactly what caused the
# earlier trap (ASR living inside [slm], which nobody would guess):
#   local TTS (TTS_BACKEND=local)      pip install piper-tts   or   pip install voxcpm
#   the training scripts in finetune/  pip install ms-swift==4.5.2 bitsandbytes

[project.urls]
Homepage = "https://github.com/lang-jiaqi/Voicemem_open"
Repository = "https://github.com/lang-jiaqi/Voicemem_open"
Issues = "https://github.com/lang-jiaqi/Voicemem_open/issues"

[tool.setuptools.packages.find]
include = ["voicemem*"]

[tool.setuptools.package-data]
# The prompt text under data/ is read at runtime (see
# leftbrain/mem0_additive_prompt_build.py). Without declaring it explicitly it never
# lands in the wheel, and the first call after install is a FileNotFoundError.
#
# assets/*.wav are the sample clips used by the README and examples (1MB total). Leave
# them out of the package and a pip install followed by the README's first example is a
# LibsndfileError -- which is someone's first impression of this project.
# voicemem.sample_audio() looks in the repo's assets/ first and falls back to this copy.
"*" = ["data/*.txt", "*.txt", "assets/*.wav"]
